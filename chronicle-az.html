abel:"The Venus Project / Gələcəyin layihələndirilməsi",start:2012.08,end:2016.5,role:"MDB üzrə icma administratoru · Baş redaktor",type:"project",color:"#ffc83d",bullets:["Beynəlxalq icmanı və media istiqamətini inkişaf etdirdim; icmaların üzv sayı bir milyona çatdı.","Onlarla redaktoru işə cəlb etdim və işlərini əlaqələndirdim.","70 mənbədən materialların dərcini avtomatlaşdırdım.","Sərgi stendlərini, ictimai tədbirləri, VR və 3D materialların hazırlanmasını təşkil etdim."]},{title:"Orange Studio",start:2013.5,end:2014.5,role:"Rəhbər və biznes inzibatçısı",type:"leadership",color:"#ff5d55",bullets:["Prosesləri optimallaşdırdım və komandanı idarə etdim.","Neft şirkətləri, aviaşirkətlər və banklarla B2B tərəfdaşlıqlarını inkişaf etdirdim.","Borcları azaltdım və müştəri xidmətini yaxşılaşdırdım."]},{title:"Silk Way Ground Handling",start:2015.5,end:2016,role:"Texniki satınalma mütəxəssisi",type:"operations",color:"#22b9aa",bullets:["Beynəlxalq satınalmaları və istehsalçılarla danışıqları apardım.","Yerüstü xidmət üçün komponentlər seçdim.","Keyfiyyətə, müddətlərə və büdcəyə nəzarət etdim."]},{title:"Ensafe Engineering LLC / Caspian Shipyard Company",label:"Ensafe Engineering LLC",start:2014.5,end:2015.5,role:"Koordinator · M1133/H-113 layihəsi",type:"operations",color:"#ff7a3d",bullets:["CSC gəmiqayırma zavodunda altı ölkədən olan 43 işçinin fəaliyyətini əlaqələndirdim.","Materialların logistikasını, əməyin təhlükəsizliyini və gündəlik təlimatlandırmanı idarə etdim.","Miqrasiya və inzibati sənədləşməni apardım."]},{title:"Сrеаtivе Nаtiоn",start:2018,end:2019.25,role:"Biznes inzibatçısı və marketoloq",type:"media",color:"#6c5ce7",bullets:["Marketinq strategiyalarını hazırladım, auditoriyanı araşdırdım, SMM və müştəri layihələrini inkişaf etdirdim.","Marketinq məsələlərini həll etdim və biznesi inkişaf etdirdim.","Prosesləri, podratçıları və istehsalı təşkil etdim."]},{title:"Nuzеst Russiа",start:2019.42,end:2021,role:"Biznesin inkişafı üzrə menecer · Biznes inzibatçısı · Kommersiya direktoru",type:"project",color:"#10b8cf",bullets:["Prosesləri yenidən təşkil etdim, məhsul, qiymət, valyuta, xərc və anbar məlumatlarının ERP tipli bazasını yaratdım.","Məhsulların sertifikatlaşdırılmasını və qeydiyyatını, o cümlədən bəyannamələri və dövlət qeydiyyatı sənədlərini təmin etdim.","SWOT təhlili apardım, investorlar üçün materiallar və qiymət siyasəti hazırladım.","Onlayn mağaza, marketpleyslər, CRM, virtual telefon sistemi, onlayn kassalar və fiskal məlumat xidmətlərinə rəhbərlik etdim.","B2B satışlarını inkişaf etdirdim, o cümlədən Rusiya Olimpiya Komitəsi ilə görüşdə kommersiya danışıqları apardım."]},{title:"Tеntасlе Меdiа",start:2019.67,end:2026.6797875792745,role:"İnfluenser marketinqi agentliyinin icraçı direktoru",type:"leadership",color:"#ffc83d",link:"https://www.tentacle.media/",bullets:["Agentliyi sıfırdan qurdum: biznes modeli, mövqeləndirmə, satış və icra standartları.","Kommersiya yönümlü YouTube kanallarını tapmaq üçün proqram təminatının və on minlərlə kontent müəllifini əhatə edən bazanın yaradılmasına təşəbbüs göstərdim. Xronikadakı təxminən dörd milyard göstəricisi abunə saylarının cəmidir, unikal insanların sayı deyil.","Auditoriyanın loyallığını, reklam tarixçəsini, qiymətləri və müştərinin tapşırığına uyğunluğu nəzərə alan, məlumatlara əsaslanan seçim metodologiyası hazırladım.","Kommersiya baxımından uyğun auditoriyalı müəlliflər tapmaq üçün üçmərhələli rəqib təhlili yaratdım.","Reklam xərclərinin ödənilməsini və marketinq sərmayəsinin gəlirliliyini (ROMI) süni intellektlə proqnozlaşdırmaq konsepsiyasının hazırlanmasına rəhbərlik etdim.","Xronikaya görə müştərilərin təxminən yarısını təşkil edən digər agentlikləri cəlb edən dəyər təklifi formalaşdırdım.","Kampaniyaların miqyasını artırdım: müəllif axtarışı, ilkin əlaqə, qiymət razılaşmaları, sənədləşmə, keyfiyyətə nəzarət və təhlükəsiz sövdələşmələr.","Menecerlərə və tərəfdaşlara influenser marketinqi xidmətlərinin satışını öyrətdim; araşdırmalar və çıxışlar vasitə
